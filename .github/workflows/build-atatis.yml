name: Build A-tatis 3D 3.5 APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble A-tatis 3D game source
        run: cat source3d/AtatisGame.part00 source3d/AtatisGame.part01 source3d/AtatisGame.part02 source3d/AtatisGame.part03 > app/src/main/java/cl/medina/atatis35/AtatisGame.java

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A-tatis-3D-3.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A-tatis-3D-3.5-APK
          path: A-tatis-3D-3.5.apk
          if-no-files-found: error
          retention-days: 14

plugins {
    id 'com.android.application'
}

configurations { natives }

android {
    namespace 'cl.medina.atatis35'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.medina.atatis35'
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName '3.5.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a').mkdirs()
        file('libs/arm64-v8a').mkdirs()
        file('libs/x86_64').mkdirs()
    }
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn tasks.named('copyAndroidNatives')
    }
}
